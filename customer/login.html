<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>客户登录 - 牧美满</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #F7F4EF; }
  .heading { font-family: 'Fraunces', serif; letter-spacing: -0.02em; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
<link rel="stylesheet" href="mobile.css"/>
</head>
<body class="flex flex-col min-h-screen">

<!-- 背景装饰 -->
<div class="fixed inset-0 pointer-events-none overflow-hidden">
  <div class="absolute -top-24 -right-12 w-96 h-96 rounded-full bg-[#C4612F] opacity-10 blur-3xl"></div>
  <div class="absolute -bottom-16 -left-16 w-72 h-72 rounded-full bg-[#C4612F] opacity-10 blur-3xl"></div>
</div>

<main class="flex-grow flex items-center justify-center px-4 py-10 relative z-10">
  <div class="w-full max-w-[480px]">

    <!-- Logo & 标题 -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-[#C4612F] to-[#A94E22] shadow-lg shadow-[#C4612F]/20 mb-4">
        <img src="../Pic/Logo.png" alt="牧美满" class="w-12 h-12 object-contain"/>
      </div>
      <h1 class="text-3xl font-bold text-[#1F2421] heading mb-2">欢迎来到牧美满</h1>
      <p class="text-[#5C635D] text-sm">登录后享受礼卡兑换服务</p>
    </div>

    <!-- 登录卡片 -->
    <div class="bg-white rounded-3xl shadow-xl shadow-[#E7E1D7]/50 border border-[#E7E1D7] p-8">

      <!-- 错误提示 -->
      <div id="error-msg" class="hidden mb-6 p-4 bg-red-50 border border-red-200 rounded-2xl text-red-600 text-sm flex items-center gap-3">
        <span class="material-symbols-outlined text-xl">error</span>
        <span id="error-text"></span>
      </div>

      <!-- 成功提示 -->
      <div id="success-msg" class="hidden mb-6 p-4 bg-green-50 border border-green-200 rounded-2xl text-green-600 text-sm flex items-center gap-3">
        <span class="material-symbols-outlined text-xl">check_circle</span>
        <span id="success-text"></span>
      </div>

      <!-- 统一登录表单 -->
      <form id="form-login" class="space-y-5" onsubmit="doUnifiedLogin(event)">
        <div class="space-y-2">
          <label class="text-sm font-semibold text-[#1F2421] ml-1">账号 / 手机号 / 邮箱</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#5C635D]">person</span>
            <input id="credential" type="text" value="13900000001"
              class="w-full bg-[#FBF9F5] border border-[#E7E1D7] rounded-xl py-4 pl-12 pr-4 text-[#1F2421] focus:outline-none focus:ring-2 focus:ring-[#C4612F] focus:border-transparent transition-all"
              placeholder="请输入账号、手机号或邮箱"/>
          </div>
          <p class="text-xs text-[#5C635D] ml-1">支持使用账号、手机号或邮箱登录</p>
        </div>

        <div class="space-y-2">
          <div class="flex justify-between items-center px-1">
            <label class="text-sm font-semibold text-[#1F2421]">登录密码</label>
            <a href="#" class="text-xs text-[#C4612F] hover:underline">忘记密码?</a>
          </div>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#5C635D]">lock</span>
            <input id="password" type="password" value="user123"
              class="w-full bg-[#FBF9F5] border border-[#E7E1D7] rounded-xl py-4 pl-12 pr-12 text-[#1F2421] focus:outline-none focus:ring-2 focus:ring-[#C4612F] focus:border-transparent transition-all"
              placeholder="请输入密码（至少6位）"/>
            <button type="button" onclick="togglePassword()"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-[#5C635D] hover:text-[#1F2421] transition-colors">
              <span id="password-eye" class="material-symbols-outlined">visibility</span>
            </button>
          </div>
        </div>

        <button type="submit"
          class="w-full bg-gradient-to-r from-[#C4612F] to-[#A94E22] text-white font-semibold text-base py-4 rounded-xl shadow-lg shadow-[#C4612F]/30 hover:shadow-xl hover:shadow-[#C4612F]/40 active:scale-[.98] transition-all">
          立即登录
        </button>
      </form>

      <!-- 分割线 -->
      <div class="relative my-8 text-center">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-[#E7E1D7]"></div></div>
        <span class="relative px-4 bg-white text-xs text-[#5C635D] uppercase tracking-wider">快速体验</span>
      </div>

      <!-- 游客登录 -->
      <button onclick="guestLogin()"
        class="w-full flex items-center justify-center gap-3 py-4 border-2 border-[#E7E1D7] rounded-xl text-[#1F2421] font-medium hover:bg-[#FBF9F5] hover:border-[#C4612F] transition-all">
        <span class="material-symbols-outlined text-2xl">person_off</span>
        <span>游客模式</span>
      </button>
    </div>

    <!-- 提示信息 -->
    <div class="mt-6 p-4 bg-white rounded-2xl border border-[#E7E1D7]">
      <div class="flex items-start gap-3">
        <span class="material-symbols-outlined text-[#C4612F]">info</span>
        <div class="flex-1">
          <p class="text-sm font-semibold text-[#1F2421] mb-1">新用户自动注册</p>
          <p class="text-xs text-[#5C635D]">首次登录时，系统会自动创建您的账号。登录后请前往"设置"页面完善个人信息。</p>
        </div>
      </div>
    </div>

    <!-- 测试账号提示（开发环境） -->
    <div class="mt-4 p-4 bg-white rounded-2xl border border-[#E7E1D7]">
      <div class="flex items-start gap-3 mb-3">
        <span class="material-symbols-outlined text-[#C4612F]">bug_report</span>
        <div class="flex-1">
          <p class="text-sm font-semibold text-[#1F2421] mb-1">测试账号快速登录</p>
          <p class="text-xs text-[#5C635D]">开发测试用，点击下方按钮切换到测试客户</p>
        </div>
      </div>
      <button onclick="testLogin(1)"
        class="w-full py-3 bg-[#FBF9F5] border border-[#E7E1D7] rounded-xl text-sm text-[#1F2421] hover:bg-[#C4612F] hover:text-white hover:border-[#C4612F] transition-all">
        <span class="font-medium">测试客户（ID: 1）</span>
        <span class="text-xs opacity-70 ml-2">· 手机: 13900000001 · 密码: user123</span>
      </button>
    </div>

    <!-- 服务协议 -->
    <p class="text-center text-xs text-[#5C635D] mt-6 opacity-70">
      登录即代表同意
      <a href="#" class="underline text-[#C4612F]">服务协议</a>
      和
      <a href="#" class="underline text-[#C4612F]">隐私政策</a>
    </p>
  </div>
</main>

<script src="../db.js"></script>
<script>
DB.init();

// 切换密码可见性
function togglePassword() {
  const input = document.getElementById('password');
  const icon = document.getElementById('password-eye');

  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = 'visibility_off';
  } else {
    input.type = 'password';
    icon.textContent = 'visibility';
  }
}

// 统一登录 / 自动注册
function doUnifiedLogin(e) {
  e.preventDefault();

  const credential = document.getElementById('credential').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!credential) {
    showError('请输入账号、手机号或邮箱');
    return;
  }

  if (!password) {
    showError('请输入密码');
    return;
  }

  if (password.length < 6) {
    showError('密码至少需要6位');
    return;
  }

  // 调用统一认证方法
  const result = DB.customerAuth(credential, password);

  if (!result.success) {
    showError(result.message);
    return;
  }

  // 登录成功
  if (result.isNew) {
    showSuccess('账号创建成功！请前往设置页面完善个人信息');
    setTimeout(() => {
      localStorage.setItem('_customer_id', result.customer.id);
      window.location.href = 'index.html';
    }, 1500);
  } else {
    localStorage.setItem('_customer_id', result.customer.id);
    window.location.href = 'index.html';
  }
}

// 游客登录
function guestLogin() {
  const customers = DB._get('customers') || [];

  // 创建匿名游客
  const guest = {
    id: DB._nextId(customers),
    name: '游客用户',
    phone: null,
    email: null,
    wechat_id: null,
    username: null,
    password: null,
    status: 'active',
    created_at: new Date().toISOString()
  };

  customers.push(guest);
  DB._set('customers', customers);

  localStorage.setItem('_customer_id', guest.id);
  window.location.href = 'index.html';
}

// 测试账号登录（开发用）
function testLogin(customerId) {
  localStorage.setItem('_customer_id', customerId);
  window.location.href = 'index.html';
}

// 错误提示
function showError(msg) {
  const box = document.getElementById('error-msg');
  document.getElementById('error-text').textContent = msg;
  box.classList.remove('hidden');
  setTimeout(() => {
    box.classList.add('hidden');
  }, 3000);
}

// 成功提示
function showSuccess(msg) {
  const box = document.getElementById('success-msg');
  document.getElementById('success-text').textContent = msg;
  box.classList.remove('hidden');
}

function hideError() {
  document.getElementById('error-msg').classList.add('hidden');
}
</script>
</body>
</html>
