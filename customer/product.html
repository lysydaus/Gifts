<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>产品详情 - 牧美满</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #F7F4EF; }
  .heading { font-family: 'Fraunces', serif; letter-spacing: -0.02em; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
<link rel="stylesheet" href="mobile.css"/>
</head>
<body>

<!-- 顶部 -->
<div class="bg-white border-b border-[#E7E1D7] px-4 py-3 sticky top-0 z-40">
  <div class="flex items-center gap-3">
    <a href="index.html" class="w-9 h-9 rounded-full hover:bg-[#FBF9F5] flex items-center justify-center transition-colors">
      <span class="material-symbols-outlined text-[#C4612F]">arrow_back</span>
    </a>
    <h1 class="text-lg font-semibold text-[#1F2421]">产品详情</h1>
  </div>
</div>

<!-- 主内容 -->
<div class="pb-20">
  <!-- 产品介绍 -->
  <div class="mb-6" id="productIntro">
    <!-- 动态加载 -->
  </div>

  <!-- 可兑换礼盒 -->
  <div class="px-4">
    <div class="mb-4 flex items-center justify-between">
      <h3 class="heading text-xl text-[#1F2421]">可兑换礼盒</h3>
      <span class="text-sm text-[#5C635D]" id="boxCount">0个礼盒</span>
    </div>
    <div class="grid grid-cols-2 gap-3" id="giftBoxesList">
      <!-- 动态加载 -->
    </div>
  </div>
</div>

<div id="nav"></div>

<script src="../db.js"></script>
<script src="nav.js"></script>
<script>
document.getElementById('nav').innerHTML = CustomerNav.render('home');

const urlParams = new URLSearchParams(window.location.search);
const productId = parseInt(urlParams.get('id'));

function loadProduct() {
  const product = DB.getProduct(productId);
  if (!product) {
    document.getElementById('productIntro').innerHTML = '<div class="text-center py-12 text-[#5C635D]">产品不存在</div>';
    return;
  }

  const suppliers = DB._get('suppliers');
  const supplier = suppliers.find(s => s.id === product.supplier_id);

  // 产品介绍
  document.getElementById('productIntro').innerHTML = `
    <!-- 产品主图 -->
    <div class="aspect-[4/3] bg-[#FBF9F5] relative">
      ${product.intro_images && product.intro_images[0] ? `
        <img src="../${product.intro_images[0]}" alt="${product.name}" class="w-full h-full object-cover"/>
      ` : `
        <div class="w-full h-full flex items-center justify-center">
          <span class="material-symbols-outlined text-8xl text-[#E7E1D7]">inventory</span>
        </div>
      `}
    </div>

    <!-- 产品信息 -->
    <div class="px-4 py-6 bg-white">
      <h2 class="heading text-2xl text-[#1F2421] mb-2">${product.name}</h2>
      <p class="text-sm text-[#5C635D] mb-4">${product.description || ''}</p>

      ${supplier ? `
        <div class="flex items-center gap-2 mb-4 text-sm text-[#5C635D]">
          <span class="material-symbols-outlined text-base">store</span>
          <span>供应商: ${supplier.name}</span>
        </div>
      ` : ''}

      <!-- 产品特点 -->
      ${product.features && product.features.length > 0 ? `
        <div class="p-4 bg-[#FBF9F5] rounded-xl">
          <p class="text-sm font-medium text-[#1F2421] mb-3">产品特点</p>
          <div class="grid grid-cols-2 gap-2">
            ${product.features.map(f => `
              <div class="flex items-center gap-2 text-sm text-[#5C635D]">
                <span class="w-1.5 h-1.5 rounded-full bg-[#C4612F]"></span>
                <span>${f}</span>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}
    </div>
  `;
}

function loadGiftBoxes() {
  const boxes = DB.getGiftBoxes({ product_id: productId });
  const cardTypes = DB._get('card_types');

  document.getElementById('boxCount').textContent = `${boxes.length}个礼盒`;

  const container = document.getElementById('giftBoxesList');
  if (boxes.length === 0) {
    container.innerHTML = '<div class="text-center py-8 text-[#5C635D]">暂无可兑换礼盒</div>';
    return;
  }

  container.innerHTML = boxes.map(box => {
    const availableCardTypes = cardTypes.filter(ct => box.card_types.includes(ct.name.replace('型', '')));

    return `
      <div class="bg-white rounded-2xl border border-[#E7E1D7] overflow-hidden">
        <!-- 礼盒图片 - 可点击 -->
        <a href="box-detail.html?id=${box.id}" class="block aspect-[16/9] bg-[#FBF9F5] relative">
          ${box.images && box.images[0] ? `
            <img src="../${box.images[0]}" alt="${box.name}" class="w-full h-full object-cover"/>
          ` : `
            <div class="w-full h-full flex items-center justify-center">
              <span class="material-symbols-outlined text-6xl text-[#E7E1D7]">inventory_2</span>
            </div>
          `}
          <div class="absolute top-3 right-3 px-3 py-1 bg-white/90 backdrop-blur rounded-full">
            <p class="text-sm font-semibold text-[#C4612F]">¥${box.price}</p>
          </div>
        </a>

        <!-- 礼盒信息 -->
        <div class="p-4">
          <h3 class="text-lg font-semibold text-[#1F2421] mb-3">${box.name}</h3>

          <!-- 礼卡型号 + 立即兑换 同一行 -->
          <div class="flex items-center gap-2">
            <div class="flex flex-wrap gap-1">
              ${availableCardTypes.map(ct => `
                <span class="px-2 py-1 bg-[#F2E3D6] text-[#C4612F] rounded-lg text-xs font-medium">
                  ${ct.name}
                </span>
              `).join('')}
            </div>
            <a href="redeem.html?box=${box.id}"
               class="ml-auto shrink-0 px-4 py-2 bg-[#C4612F] hover:bg-[#A94E22] text-white rounded-xl text-sm font-medium transition-colors">
              立即兑换
            </a>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

loadProduct();
loadGiftBoxes();
</script>
</body>
</html>
