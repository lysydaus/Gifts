<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>我的 - 牧美满</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #F7F4EF; }
  .heading { font-family: 'Fraunces', serif; letter-spacing: -0.02em; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
<link rel="stylesheet" href="mobile.css"/>
</head>
<body>

<!-- 顶部 -->
<div class="bg-white border-b border-[#E7E1D7] px-4 py-3 sticky top-0 z-40 flex items-center justify-between">
  <h1 class="text-lg font-semibold text-[#1F2421]">我的</h1>
  <a href="settings.html" class="flex items-center gap-1 px-3 py-1.5 rounded-full text-sm text-[#C4612F] hover:bg-[#FBF9F5] transition-colors">
    <span class="material-symbols-outlined text-lg">settings</span>
    <span>设置</span>
  </a>
</div>

<!-- 主内容 -->
<div class="px-4 py-6">
  <!-- 用户信息卡 -->
  <div class="mb-6 p-6 bg-gradient-to-br from-[#C4612F] to-[#A94E22] rounded-3xl text-white relative overflow-hidden">
    <div class="relative z-10">
      <div class="w-16 h-16 rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center mb-4">
        <span class="material-symbols-outlined text-4xl">person</span>
      </div>
      <h2 class="text-xl font-semibold mb-1" id="userName">匿名用户</h2>
      <p class="text-sm text-white/80" id="userPhone">未设置联系方式</p>
    </div>
    <div class="absolute top-0 right-0 w-32 h-32 rounded-full bg-white/10 blur-3xl"></div>
  </div>

  <!-- 我的数据 -->
  <div class="mb-6 grid grid-cols-3 gap-3">
    <div class="p-4 bg-white rounded-2xl border border-[#E7E1D7] text-center">
      <p class="text-2xl font-semibold text-[#C4612F] mb-1" id="cardCount">0</p>
      <p class="text-xs text-[#5C635D]">我的礼卡</p>
    </div>
    <div class="p-4 bg-white rounded-2xl border border-[#E7E1D7] text-center">
      <p class="text-2xl font-semibold text-[#C4612F] mb-1" id="orderCount">0</p>
      <p class="text-xs text-[#5C635D]">我的订单</p>
    </div>
    <div class="p-4 bg-white rounded-2xl border border-[#E7E1D7] text-center">
      <p class="text-2xl font-semibold text-[#C4612F] mb-1" id="redeemedCount">0</p>
      <p class="text-xs text-[#5C635D]">已兑换</p>
    </div>
  </div>

  <!-- 快捷功能 -->
  <div class="mb-6 bg-white rounded-2xl border border-[#E7E1D7] overflow-hidden">
    <div class="px-5 py-4 border-b border-[#E7E1D7]">
      <h3 class="text-base font-semibold text-[#1F2421]">快捷功能</h3>
    </div>
    <div class="p-5 space-y-4">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-[#F2E3D6] flex items-center justify-center">
          <span class="material-symbols-outlined text-[#C4612F] text-2xl">store</span>
        </div>
        <div>
          <h4 class="font-semibold text-[#1F2421]" id="storeNameDisplay">牧美满</h4>
          <p class="text-xs text-[#5C635D]" id="storeBrandDisplay">牧羊天成 美满人席</p>
        </div>
      </div>
      <div class="p-3 bg-[#FBF9F5] rounded-xl space-y-2 text-sm">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-[#5C635D] text-lg">call</span>
          <span class="text-[#1F2421]" id="storePhoneDisplay">0471-3353365</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-[#5C635D] text-lg">schedule</span>
          <span class="text-[#1F2421]" id="storeHoursDisplay">9:00-17:30</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 快捷入口 -->
  <div class="bg-white rounded-2xl border border-[#E7E1D7] overflow-hidden">
    <a href="addresses.html" class="flex items-center justify-between px-5 py-4 hover:bg-[#FBF9F5] transition-colors">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-[#C4612F]">location_on</span>
        <span class="text-sm text-[#1F2421]">收货地址</span>
      </div>
      <span class="material-symbols-outlined text-[#5C635D]">chevron_right</span>
    </a>
  </div>
</div>

<div id="nav"></div>

<script src="../db.js"></script>
<script src="nav.js"></script>
<script>
document.getElementById('nav').innerHTML = CustomerNav.render('profile');
const customerId = getOrCreateCustomerId();

// 加载用户信息
function loadUserInfo() {
  const customers = DB._get('customers');
  const customer = customers.find(c => c.id === customerId);

  if (customer) {
    // 显示用户信息
    document.getElementById('userName').textContent = customer.name || '匿名用户';
    document.getElementById('userPhone').textContent = customer.phone || '未设置联系方式';
  }
}

// 加载统计数据
function loadStats() {
  const cards = DB.getCards().filter(c => c.customer_id === customerId);
  const orders = DB.getOrders().filter(o => o.customer_id === customerId);
  const redeemedCards = cards.filter(c => c.status === 'used');

  document.getElementById('cardCount').textContent = cards.length;
  document.getElementById('orderCount').textContent = orders.length;
  document.getElementById('redeemedCount').textContent = redeemedCards.length;
}

// 加载店铺信息
function loadStoreInfo() {
  const store = DB._get('store');
  if (store) {
    document.getElementById('storeNameDisplay').textContent = store.name || '牧美满';
    document.getElementById('storeBrandDisplay').textContent = store.brand || '牧羊天成 美满人席';
    document.getElementById('storePhoneDisplay').textContent = store.phone || '0471-3353365';
    document.getElementById('storeHoursDisplay').textContent = store.service_hours || '9:00-17:30';
  }
}

loadUserInfo();
loadStats();
loadStoreInfo();
</script>
</body>
</html>
