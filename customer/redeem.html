<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>兑换产品 - 牧美满</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #F7F4EF; }
  .heading { font-family: 'Fraunces', serif; letter-spacing: -0.02em; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
<link rel="stylesheet" href="mobile.css"/>
</head>
<body>

<!-- 顶部 -->
<div class="bg-white border-b border-[#E7E1D7] px-4 py-3 sticky top-0 z-40">
  <div class="flex items-center gap-3">
    <a href="javascript:history.back()" class="w-9 h-9 rounded-full hover:bg-[#FBF9F5] flex items-center justify-center">
      <span class="material-symbols-outlined text-[#1F2421]">arrow_back</span>
    </a>
    <h1 class="text-lg font-semibold text-[#1F2421]">兑换产品</h1>
  </div>
</div>

<!-- 主内容 -->
<div class="px-4 py-6 pb-24">
  <!-- 选择礼卡 -->
  <div class="mb-6 p-5 bg-white rounded-2xl border border-[#E7E1D7]">
    <h2 class="text-base font-semibold text-[#1F2421] mb-3">选择礼卡</h2>
    <select id="cardSelect" required
            class="w-full px-4 py-3 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]">
      <option value="">请选择可用礼卡</option>
    </select>

    <!-- 密码输入（绑卡时未填密码才显示） -->
    <div id="passwordSection" class="mt-4 hidden">
      <label class="block text-sm font-medium text-[#1F2421] mb-2">礼卡密码 *</label>
      <input type="text" id="cardPassword" maxlength="6"
             class="w-full px-4 py-3 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
             placeholder="请输入6位礼卡密码"/>
      <p class="text-xs text-[#5C635D] mt-2">此礼卡绑定时未填写密码，兑换时需验证</p>
    </div>
  </div>

  <!-- 产品信息 -->
  <div id="productInfo" class="mb-6 bg-white rounded-2xl border border-[#E7E1D7] overflow-hidden" style="display:none;">
    <div class="aspect-[16/9] bg-[#FBF9F5] relative" id="productImage">
      <!-- 动态加载 -->
    </div>
    <div class="p-4">
      <h3 class="text-lg font-semibold text-[#1F2421] mb-1" id="productName"></h3>
      <p class="text-sm text-[#5C635D] mb-3" id="productDesc"></p>
      <div class="p-3 bg-[#FBF9F5] rounded-xl">
        <p class="text-xs text-[#5C635D] mb-2">礼盒内容</p>
        <div class="space-y-1" id="productContents"></div>
      </div>
    </div>
  </div>

  <!-- 收货地址 -->
  <div class="mb-6 p-5 bg-white rounded-2xl border border-[#E7E1D7]">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-semibold text-[#1F2421]">收货地址</h2>
      <a href="addresses.html" class="text-sm text-[#C4612F] hover:text-[#A94E22]">管理地址</a>
    </div>

    <div id="addressList">
      <!-- 加载地址 -->
    </div>
  </div>

  <!-- 备注 -->
  <div class="mb-6 p-5 bg-white rounded-2xl border border-[#E7E1D7]">
    <label class="block text-sm font-medium text-[#1F2421] mb-2">备注（选填）</label>
    <textarea id="note" rows="2"
              class="w-full px-4 py-3 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F] resize-none"
              placeholder="有特殊要求可以备注"></textarea>
  </div>

  <!-- 提交按钮 -->
  <div class="space-y-3">
    <button onclick="submitRedeem()"
            class="w-full px-4 py-3 bg-[#C4612F] hover:bg-[#A94E22] text-white rounded-full font-medium transition-colors">
      单独发货
    </button>
    <button onclick="addToCart()"
            class="w-full px-4 py-3 bg-white hover:bg-[#FBF9F5] text-[#C4612F] border-2 border-[#C4612F] rounded-full font-medium transition-colors">
      加入购物车
    </button>
  </div>
</div>

<div id="nav"></div>

<script src="../db.js"></script>
<script src="nav.js"></script>
<script>
document.getElementById('nav').innerHTML = CustomerNav.render('cards');
const customerId = getOrCreateCustomerId();

// 获取URL参数
const urlParams = new URLSearchParams(window.location.search);
const preselectedBoxId = urlParams.get('box');
const preselectedCardNumber = urlParams.get('card');

let selectedBox = null;
let selectedAddressId = null;
let selectedCard = null;

// 加载可用礼卡
function loadCards() {
  let cards = DB.getCards().filter(c =>
    c.customer_id === customerId &&
    c.status === 'active' &&
    c.redeem_status === 'unredeemed' &&
    new Date(c.expire_at) >= new Date()
  );

  const cardTypes = DB._get('card_types');
  const select = document.getElementById('cardSelect');

  // 如果从产品页带入礼盒，则只显示型号匹配该礼盒的礼卡
  if (preselectedBoxId) {
    const box = DB.getGiftBoxes().find(b => b.id === parseInt(preselectedBoxId));
    if (box) {
      cards = cards.filter(card => {
        const cardType = cardTypes.find(ct => ct.id === card.type_id);
        if (!cardType) return false;
        const cardTypeKey = cardType.name.replace('型', '');
        return box.card_types.includes(cardTypeKey);
      });
    }
  }

  if (cards.length === 0) {
    select.innerHTML = '<option value="">暂无可兑换此礼盒的礼卡</option>';
    return;
  }

  select.innerHTML = '<option value="">请选择可用礼卡</option>' +
    cards.map(card => {
      const cardType = cardTypes.find(ct => ct.id === card.type_id);
      const typeName = cardType ? cardType.name : '未知类型';
      return `<option value="${card.id}">${DB._decrypt(card.card_no_encrypted)} (${typeName})</option>`;
    }).join('');

  // 预选礼卡
  if (preselectedCardNumber) {
    const preCard = cards.find(c => DB._decrypt(c.card_no_encrypted) === preselectedCardNumber);
    if (preCard) {
      select.value = preCard.id;
      onCardSelect();
    }
  }
}

// 礼卡选择变化
function onCardSelect() {
  const select = document.getElementById('cardSelect');
  const cardId = parseInt(select.value);

  if (!cardId) {
    document.getElementById('productInfo').style.display = 'none';
    document.getElementById('passwordSection').classList.add('hidden');
    selectedCard = null;
    return;
  }

  const cards = DB.getCards();
  selectedCard = cards.find(c => c.id === cardId);

  if (!selectedCard) return;

  // 绑定时未验证密码，则兑换时需补填密码
  const needPassword = !selectedCard.password_verified;
  if (needPassword) {
    document.getElementById('passwordSection').classList.remove('hidden');
    document.getElementById('cardPassword').required = true;
    // 测试环境：自动填充密码
    const realPassword = DB._decrypt(selectedCard.password_encrypted);
    document.getElementById('cardPassword').value = realPassword;
  } else {
    document.getElementById('passwordSection').classList.add('hidden');
    document.getElementById('cardPassword').required = false;
    document.getElementById('cardPassword').value = '';
  }

  const cardTypes = DB._get('card_types');
  const cardType = cardTypes.find(ct => ct.id === selectedCard.type_id);

  // 如果预选了产品，检查是否匹配
  if (preselectedBoxId) {
    const box = DB.getGiftBoxes().find(b => b.id === parseInt(preselectedBoxId));
    if (box && cardType) {
      const cardTypeKey = cardType.name.replace('型', '');
      if (box.card_types.includes(cardTypeKey)) {
        loadProduct(preselectedBoxId);
        return;
      } else {
        alert('该礼卡类型不支持兑换此产品');
        select.value = '';
        selectedCard = null;
        return;
      }
    }
  }

  // 否则显示所有可兑换产品
  if (cardType) {
    const cardTypeKey = cardType.name.replace('型', '');
    const availableBoxes = DB.getGiftBoxes().filter(b => b.card_types.includes(cardTypeKey));

    if (availableBoxes.length > 0) {
      loadProduct(availableBoxes[0].id);
    }
  }
}

document.getElementById('cardSelect').addEventListener('change', onCardSelect);

// 加载产品
function loadProduct(boxId) {
  const giftBoxes = DB.getGiftBoxes();
  const box = giftBoxes.find(b => b.id === parseInt(boxId));

  if (!box) return;

  selectedBox = box;
  const productInfo = document.getElementById('productInfo');
  productInfo.style.display = 'block';

  // 产品图片
  const imageContainer = document.getElementById('productImage');
  if (box.images && box.images[0]) {
    imageContainer.innerHTML = `<img src="../${box.images[0]}" alt="${box.name}" class="w-full h-full object-cover"/>`;
  } else {
    imageContainer.innerHTML = `
      <div class="w-full h-full flex items-center justify-center">
        <span class="material-symbols-outlined text-6xl text-[#E7E1D7]">inventory_2</span>
      </div>
    `;
  }

  // 产品信息
  document.getElementById('productName').textContent = box.name;
  document.getElementById('productDesc').textContent = box.description;

  // 礼盒内容
  document.getElementById('productContents').innerHTML = box.contents.map(item => `
    <div class="flex items-center gap-2 text-xs text-[#1F2421]">
      <span class="w-1 h-1 rounded-full bg-[#C4612F]"></span>
      <span>${item}</span>
    </div>
  `).join('');
}

// 加载收货地址
function loadAddresses() {
  const addresses = DB.getCustomerAddresses(customerId);
  const container = document.getElementById('addressList');

  if (addresses.length === 0) {
    container.innerHTML = `
      <div class="text-center py-8">
        <p class="text-sm text-[#5C635D] mb-3">暂无收货地址</p>
        <a href="addresses.html"
           class="inline-block px-4 py-2 bg-[#C4612F] hover:bg-[#A94E22] text-white rounded-full text-sm transition-colors">
          添加收货地址
        </a>
      </div>
    `;
    return;
  }

  // 默认选中默认地址
  const defaultAddr = addresses.find(a => a.is_default);
  if (defaultAddr) {
    selectedAddressId = defaultAddr.id;
  } else {
    selectedAddressId = addresses[0].id;
  }

  container.innerHTML = addresses.map(addr => `
    <label class="flex items-start gap-3 p-4 rounded-xl border-2 ${addr.id === selectedAddressId ? 'border-[#C4612F] bg-[#FBF9F5]' : 'border-[#E7E1D7]'} cursor-pointer hover:border-[#C4612F] transition-colors mb-3">
      <input type="radio" name="address" value="${addr.id}" ${addr.id === selectedAddressId ? 'checked' : ''}
             onchange="selectedAddressId = ${addr.id}; loadAddresses();"
             class="mt-1 w-5 h-5 text-[#C4612F] focus:ring-[#C4612F]"/>
      <div class="flex-1">
        <div class="flex items-center gap-2 mb-1">
          <span class="font-semibold text-[#1F2421]">${addr.receiver_name}</span>
          <span class="text-sm text-[#5C635D]">${addr.receiver_phone}</span>
          ${addr.is_default ? '<span class="px-2 py-0.5 bg-[#C4612F] text-white rounded-full text-xs">默认</span>' : ''}
        </div>
        <p class="text-sm text-[#5C635D]">${addr.receiver_address}</p>
      </div>
    </label>
  `).join('');
}

// 提交兑换
function submitRedeem() {
  if (!selectedCard) {
    alert('请选择礼卡');
    return;
  }

  // 验证密码（如果需要）
  const passwordSection = document.getElementById('passwordSection');
  if (!passwordSection.classList.contains('hidden')) {
    const inputPassword = document.getElementById('cardPassword').value.trim();
    if (!inputPassword) {
      alert('请输入礼卡密码');
      return;
    }

    const realPassword = DB._decrypt(selectedCard.password_encrypted);
    if (inputPassword !== realPassword) {
      alert('礼卡密码错误');
      return;
    }
  }

  if (!selectedBox) {
    alert('请选择产品');
    return;
  }

  if (!selectedAddressId) {
    alert('请选择收货地址');
    return;
  }

  const addresses = DB.getCustomerAddresses(customerId);
  const selectedAddress = addresses.find(a => a.id === selectedAddressId);

  if (!selectedAddress) {
    alert('收货地址不存在');
    return;
  }

  const note = document.getElementById('note').value.trim();

  // 创建订单
  const result = DB.createOrder({
    customer_id: customerId,
    card_number: DB._decrypt(selectedCard.card_no_encrypted),
    gift_box_id: selectedBox.id,
    receiver_name: selectedAddress.receiver_name,
    receiver_phone: selectedAddress.receiver_phone,
    receiver_address: selectedAddress.receiver_address,
    note: note
  });

  if (result.success) {
    alert('兑换成功！请等待商家审核');
    window.location.href = 'orders.html';
  } else {
    alert(result.message || '兑换失败');
  }
}

// 加入购物车
function addToCart() {
  if (!selectedCard) {
    alert('请选择礼卡');
    return;
  }

  // 验证密码（如果需要）
  const passwordSection = document.getElementById('passwordSection');
  if (!passwordSection.classList.contains('hidden')) {
    const inputPassword = document.getElementById('cardPassword').value.trim();
    if (!inputPassword) {
      alert('请输入礼卡密码');
      return;
    }

    const realPassword = DB._decrypt(selectedCard.password_encrypted);
    if (inputPassword !== realPassword) {
      alert('礼卡密码错误');
      return;
    }
  }

  if (!selectedBox) {
    alert('请选择产品');
    return;
  }

  const result = DB.addToCart(customerId, selectedCard.id, selectedBox.id);

  if (result.success) {
    alert('已加入购物车');
    window.location.href = 'cart.html';
  } else {
    alert(result.message || '加入购物车失败');
  }
}

loadCards();
loadAddresses();
</script>
</body>
</html>
