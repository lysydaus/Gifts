<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>添加礼卡 - 牧美满</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #F7F4EF; }
  .heading { font-family: 'Fraunces', serif; letter-spacing: -0.02em; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
<link rel="stylesheet" href="_mobile.css"/>
</head>
<body>

<!-- 顶部 -->
<div class="bg-white border-b border-[#E7E1D7] px-4 py-3 sticky top-0 z-40">
  <div class="flex items-center gap-3">
    <a href="cards.html" class="w-9 h-9 rounded-full hover:bg-[#FBF9F5] flex items-center justify-center transition-colors">
      <span class="material-symbols-outlined text-[#1F2421]">arrow_back</span>
    </a>
    <h1 class="text-lg font-semibold text-[#1F2421]">添加礼卡</h1>
  </div>
</div>

<!-- 主内容 -->
<div class="px-4 py-6">
  <div class="p-6 bg-white rounded-2xl border border-[#E7E1D7]">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-12 h-12 rounded-xl bg-[#F2E3D6] flex items-center justify-center">
        <span class="material-symbols-outlined text-[#C4612F] text-2xl">add_card</span>
      </div>
      <div>
        <h2 class="text-lg font-semibold text-[#1F2421]">绑定礼卡</h2>
        <p class="text-xs text-[#5C635D]">输入卡号，密码可选</p>
      </div>
    </div>

    <form id="bindForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">卡号</label>
        <input type="text" id="cardNumber" required maxlength="16"
               class="w-full px-4 py-3 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F] font-mono text-lg"
               placeholder="请输入16位卡号"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">密码（可选）</label>
        <input type="password" id="cardPassword" maxlength="6"
               class="w-full px-4 py-3 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
               placeholder="如不确定密码可留空，兑换时再输入"/>
      </div>
      <button type="submit"
              class="w-full px-4 py-3 bg-[#C4612F] hover:bg-[#A94E22] text-white rounded-full font-medium transition-colors">
        立即绑定
      </button>
    </form>
  </div>

  <!-- 提示信息 -->
  <div class="mt-6 p-4 bg-white rounded-2xl border border-[#E7E1D7]">
    <div class="flex items-start gap-3">
      <span class="material-symbols-outlined text-[#C4612F]">info</span>
      <div class="flex-1">
        <p class="text-sm font-semibold text-[#1F2421] mb-1">温馨提示</p>
        <ul class="text-xs text-[#5C635D] space-y-1">
          <li>• 卡号为16位数字，请仔细核对</li>
          <li>• 密码为6位数字，如不确定可留空</li>
          <li>• 未验证密码的礼卡在兑换时需要输入密码</li>
        </ul>
      </div>
    </div>
  </div>
</div>

<script src="../db.js"></script>
<script src="_nav.js"></script>
<script>
const customerId = getOrCreateCustomerId();

// 绑定礼卡
document.getElementById('bindForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const cardNumber = document.getElementById('cardNumber').value.trim();
  const password = document.getElementById('cardPassword').value.trim();

  if (cardNumber.length !== 16) {
    alert('卡号必须是16位');
    return;
  }

  // 密码可选，如果填写则验证长度
  if (password && password.length !== 6) {
    alert('密码必须是6位');
    return;
  }

  try {
    const result = DB.bindCard(cardNumber, password || null, customerId);
    alert('绑定成功！');
    // 返回礼卡列表页
    window.location.href = 'cards.html';
  } catch (error) {
    alert(error.message || '绑定失败');
  }
});
</script>
</body>
</html>
