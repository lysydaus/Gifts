<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>管理员登录 - 牧美满礼卡系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #F7F4EF; }
  .heading { font-family: 'Fraunces', serif; letter-spacing: -0.02em; }
  .accent-text { color: #C4612F; font-style: italic; }
</style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">

<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <div class="inline-block mb-2 px-3 py-1 bg-[#1F2421] rounded-full">
      <span class="text-white text-xs font-medium tracking-wide">SYSTEM ADMIN</span>
    </div>
    <h1 class="heading text-3xl text-[#1F2421] mb-1">
      系统管理 <span class="accent-text">后台</span>
    </h1>
    <p class="text-[#5C635D] text-sm">牧美满礼卡管理系统</p>
  </div>

  <div class="bg-white rounded-3xl border border-[#E7E1D7] shadow-sm p-8">
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">管理员账号</label>
        <input type="text" id="username" required value="admin"
               class="w-full px-4 py-3 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F] transition-colors"
               placeholder="请输入管理员账号"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">密码</label>
        <input type="password" id="password" required value="admin123"
               class="w-full px-4 py-3 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F] transition-colors"
               placeholder="请输入密码"/>
      </div>

      <div id="error" class="hidden text-sm text-red-600 bg-red-50 px-4 py-2 rounded-xl"></div>

      <button type="submit"
              class="w-full bg-[#1F2421] hover:bg-[#2a2f2b] text-white font-medium py-3 rounded-full transition-colors">
        登录
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="../index.html" class="text-sm text-[#5C635D] hover:text-[#C4612F] transition-colors">
        ← 返回首页
      </a>
    </div>
  </div>

  <div class="mt-6 p-4 bg-[#FBF9F5] rounded-2xl border border-[#E7E1D7]">
    <p class="text-xs text-[#5C635D] mb-2 font-medium">测试账号</p>
    <div class="text-xs text-[#5C635D] space-y-1">
      <p>账号: <span class="font-mono text-[#C4612F]">admin</span></p>
      <p>密码: <span class="font-mono text-[#C4612F]">admin123</span></p>
    </div>
  </div>

  <div class="mt-4 text-center">
    <a href="../reset-db.html" target="_blank"
       class="inline-flex items-center gap-1 text-sm text-[#C4612F] hover:text-[#A0501F] transition-colors">
      <span>🔄</span>
      <span>恢复测试数据</span>
    </a>
  </div>
</div>

<script src="../db.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorDiv = document.getElementById('error');

  const user = DB.login(username, password, 'admin');

  if (user) {
    window.location.href = 'index.html';
  } else {
    errorDiv.textContent = '账号或密码错误';
    errorDiv.classList.remove('hidden');
  }
});
</script>
</body>
</html>
