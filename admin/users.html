<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>用户列表 - 系统管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #F7F4EF; }
  .heading { font-family: 'Fraunces', serif; }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
</style>
</head>
<body>

<div class="max-w-7xl mx-auto px-6 py-6">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="heading text-3xl text-[#1F2421] mb-1">用户管理</h2>
      <p class="text-[#5C635D] text-sm">管理系统账号和权限</p>
    </div>
    <button onclick="showAddUserModal()"
            class="flex items-center gap-2 px-6 py-3 bg-[#C4612F] hover:bg-[#A94E22] text-white rounded-full transition-colors">
      <span class="material-symbols-outlined text-xl">add</span>
      <span class="font-medium">添加用户</span>
    </button>
  </div>

  <!-- 用户列表 -->
  <div class="bg-white rounded-2xl border border-[#E7E1D7] overflow-hidden">
    <table class="w-full">
      <thead class="bg-[#FBF9F5] border-b border-[#E7E1D7]">
        <tr>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">ID</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">用户名</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">姓名</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">角色</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">电话</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">状态</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">创建时间</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">操作</th>
        </tr>
      </thead>
      <tbody id="usersTable">
        <!-- 动态加载 -->
      </tbody>
    </table>
  </div>
</div>

<!-- 添加/编辑用户弹窗 -->
<div id="userModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-3xl max-w-md w-full p-8">
    <h3 class="heading text-2xl text-[#1F2421] mb-6" id="modalTitle">添加用户</h3>
    <form id="userForm" class="space-y-5">
      <input type="hidden" id="userId"/>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">用户名</label>
        <input type="text" id="userName" required
               class="w-full px-4 py-3 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
               placeholder="登录用户名"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">姓名</label>
        <input type="text" id="userRealName" required
               class="w-full px-4 py-3 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
               placeholder="真实姓名"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">电话</label>
        <input type="tel" id="userPhone"
               class="w-full px-4 py-3 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
               placeholder="联系电话"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">角色</label>
        <select id="userRole" required
                class="w-full px-4 py-3 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]">
          <option value="">请选择角色</option>
          <option value="admin">超级管理员</option>
          <option value="merchant">商家审核员</option>
        </select>
      </div>

      <div id="passwordField">
        <label class="block text-sm font-medium text-[#1F2421] mb-2">密码</label>
        <input type="password" id="userPassword"
               class="w-full px-4 py-3 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
               placeholder="留空则不修改"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">状态</label>
        <select id="userStatus"
                class="w-full px-4 py-3 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]">
          <option value="active">激活</option>
          <option value="inactive">停用</option>
        </select>
      </div>

      <div class="flex gap-3">
        <button type="button" onclick="closeUserModal()"
                class="flex-1 px-4 py-3 border border-[#E7E1D7] text-[#1F2421] rounded-full hover:bg-[#FBF9F5]">
          取消
        </button>
        <button type="submit"
                class="flex-1 px-4 py-3 bg-[#C4612F] hover:bg-[#A94E22] text-white rounded-full">
          保存
        </button>
      </div>
    </form>
  </div>
</div>

<script src="../db.js"></script>
<script>
// 检查登录状态
const user = DB.getCurrentUser();
if (!user || user.role !== 'admin') {
  window.location.href = 'login.html';
}

const roleLabels = {
  admin: '超级管理员',
  merchant: '商家审核员'
};

function loadUsers() {
  const users = DB._get('users');
  const tbody = document.getElementById('usersTable');

  if (users.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="px-4 py-8 text-center text-[#5C635D]">暂无用户</td></tr>';
    return;
  }

  tbody.innerHTML = users.map(user => `
    <tr class="border-b border-[#E7E1D7] hover:bg-[#FBF9F5] transition-colors">
      <td class="px-4 py-3 text-sm text-[#1F2421]">${user.id}</td>
      <td class="px-4 py-3 text-sm font-medium text-[#1F2421]">${user.username}</td>
      <td class="px-4 py-3 text-sm text-[#1F2421]">${user.name || '-'}</td>
      <td class="px-4 py-3">
        <span class="px-2 py-1 bg-${user.role === 'admin' ? 'purple' : 'blue'}-100 text-${user.role === 'admin' ? 'purple' : 'blue'}-700 rounded-full text-xs font-medium">
          ${roleLabels[user.role] || user.role}
        </span>
      </td>
      <td class="px-4 py-3 text-sm text-[#1F2421]">${user.phone || '-'}</td>
      <td class="px-4 py-3">
        <span class="px-2 py-1 bg-${user.status === 'active' ? 'green' : 'gray'}-100 text-${user.status === 'active' ? 'green' : 'gray'}-700 rounded-full text-xs">
          ${user.status === 'active' ? '正常' : '禁用'}
        </span>
      </td>
      <td class="px-4 py-3 text-sm text-[#5C635D]">
        ${user.created_at ? new Date(user.created_at).toLocaleDateString() : '-'}
      </td>
      <td class="px-4 py-3">
        <button onclick="editUser(${user.id})"
                class="text-[#C4612F] hover:text-[#A94E22] text-sm font-medium mr-3">
          编辑
        </button>
        ${user.username !== 'admin' ? `
          <button onclick="toggleUserStatus(${user.id})"
                  class="text-[#5C635D] hover:text-[#1F2421] text-sm font-medium mr-3">
            ${user.status === 'active' ? '禁用' : '启用'}
          </button>
        ` : ''}
        ${user.username === 'admin' || user.role === 'merchant' ? `
          <button disabled
                  class="text-[#9CA3AF] text-sm font-medium cursor-not-allowed">
            删除
          </button>
        ` : `
          <button onclick="deleteUser(${user.id})"
                  class="text-red-600 hover:text-red-700 text-sm font-medium">
            删除
          </button>
        `}
      </td>
    </tr>
  `).join('');
}

function showAddUserModal() {
  document.getElementById('modalTitle').textContent = '添加用户';
  document.getElementById('userForm').reset();
  document.getElementById('userId').value = '';
  document.getElementById('userPassword').required = true;
  document.getElementById('userModal').classList.remove('hidden');
}

function editUser(id) {
  const users = DB._get('users');
  const user = users.find(u => u.id === id);
  if (!user) return;

  document.getElementById('modalTitle').textContent = '编辑用户';
  document.getElementById('userId').value = user.id;
  document.getElementById('userName').value = user.username;
  document.getElementById('userRealName').value = user.name || '';
  document.getElementById('userPhone').value = user.phone || '';
  document.getElementById('userRole').value = user.role;
  document.getElementById('userStatus').value = user.status;
  document.getElementById('userPassword').value = '';
  document.getElementById('userPassword').required = false;
  document.getElementById('userModal').classList.remove('hidden');
}

function closeUserModal() {
  document.getElementById('userModal').classList.add('hidden');
}

document.getElementById('userForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const userId = document.getElementById('userId').value;
  const username = document.getElementById('userName').value;
  const name = document.getElementById('userRealName').value;
  const phone = document.getElementById('userPhone').value;
  const role = document.getElementById('userRole').value;
  const status = document.getElementById('userStatus').value;
  const password = document.getElementById('userPassword').value;

  const users = DB._get('users');

  if (userId) {
    // 编辑
    const index = users.findIndex(u => u.id === parseInt(userId));
    if (index !== -1) {
      users[index].username = username;
      users[index].name = name;
      users[index].phone = phone;
      users[index].role = role;
      users[index].status = status;
      if (password) users[index].password = password;
    }
  } else {
    // 新增
    if (!password) {
      alert('新用户必须设置密码');
      return;
    }

    const existing = users.find(u => u.username === username);
    if (existing) {
      alert('用户名已存在');
      return;
    }

    users.push({
      id: DB._nextId(users),
      username,
      password,
      role,
      name,
      phone,
      status,
      created_at: new Date().toISOString()
    });
  }

  DB._set('users', users);
  alert('保存成功');
  closeUserModal();
  loadUsers();
});

function toggleUserStatus(id) {
  const users = DB._get('users');
  const user = users.find(u => u.id === id);
  if (!user) return;

  const newStatus = user.status === 'active' ? 'inactive' : 'active';
  const action = newStatus === 'active' ? '启用' : '禁用';

  if (confirm(`确定要${action}用户 ${user.name || user.username} 吗？`)) {
    user.status = newStatus;
    DB._set('users', users);
    loadUsers();
  }
}

function deleteUser(id) {
  const users = DB._get('users');
  const user = users.find(u => u.id === id);
  if (!user) return;

  // 不允许删除admin用户和merchant角色用户
  if (user.username === 'admin' || user.role === 'merchant') {
    alert('不能删除系统保留用户');
    return;
  }

  if (confirm(`确定要删除用户 ${user.name || user.username} 吗？此操作不可恢复。`)) {
    const index = users.findIndex(u => u.id === id);
    if (index !== -1) {
      users.splice(index, 1);
      DB._set('users', users);
      loadUsers();
    }
  }
}

loadUsers();
</script>
</body>
</html>
