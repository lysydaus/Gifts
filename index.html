<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>牧美满礼卡兑换系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<style>
  body {
    font-family: 'Inter', sans-serif;
    background: #F7F4EF;
    min-height: 100vh;
  }
  .heading { font-family: 'Fraunces', serif; letter-spacing: -0.02em; }
  .accent-text { color: #C4612F; font-style: italic; }
  .card-hover { transition: all 0.2s; }
  .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
</style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">

<!-- 背景装饰 -->
<div class="fixed inset-0 pointer-events-none overflow-hidden">
  <div class="absolute top-20 right-10 w-96 h-96 rounded-full bg-[#F2E3D6] opacity-30 blur-3xl"></div>
  <div class="absolute bottom-20 left-10 w-80 h-80 rounded-full bg-[#E7E1D7] opacity-40 blur-3xl"></div>
</div>

<div class="relative z-10 w-full max-w-4xl">
  <!-- 品牌标题 -->
  <div class="text-center mb-12">
    <div class="inline-block mb-3 px-4 py-1 bg-[#F2E3D6] rounded-full">
      <span class="text-[#C4612F] text-sm font-medium tracking-wide">GIFT CARD SYSTEM</span>
    </div>
    <h1 class="heading text-5xl text-[#1F2421] mb-3">
      牧美满 <span class="accent-text">礼卡兑换</span>
    </h1>
    <p class="text-[#5C635D] text-lg font-light">精选内蒙古草原优质牛羊肉  ·  品质生活从这里开始</p>
  </div>

  <!-- 入口卡片 -->
  <div class="grid md:grid-cols-3 gap-6">

    <!-- 客户入口 -->
    <a href="customer/index.html"
       class="card-hover group block p-8 bg-white rounded-3xl border border-[#E7E1D7] shadow-sm">
      <div class="w-16 h-16 mb-6 rounded-2xl bg-[#F2E3D6] flex items-center justify-center">
        <svg class="w-8 h-8 text-[#C4612F]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </div>
      <h3 class="heading text-2xl text-[#1F2421] mb-2 group-hover:text-[#C4612F] transition-colors">
        客户入口
      </h3>
      <p class="text-[#5C635D] text-sm font-light leading-relaxed">
        绑定礼卡 · 兑换产品 · 查看物流
      </p>
      <div class="mt-6 flex items-center text-[#C4612F] text-sm font-medium">
        <span>立即进入</span>
        <svg class="w-4 h-4 ml-1 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </div>
    </a>

    <!-- 商家运营入口 -->
    <a href="merchant/login.html"
       class="card-hover group block p-8 bg-gradient-to-br from-[#C4612F] to-[#A94E22] rounded-3xl shadow-lg">
      <div class="w-16 h-16 mb-6 rounded-2xl bg-white/20 flex items-center justify-center">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
      </div>
      <h3 class="heading text-2xl text-white mb-2">
        商家运营
      </h3>
      <p class="text-white/80 text-sm font-light leading-relaxed">
        礼卡管理 · 订单审核 · 物流核销
      </p>
      <div class="mt-6 flex items-center text-white text-sm font-medium">
        <span>管理后台</span>
        <svg class="w-4 h-4 ml-1 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </div>
    </a>

    <!-- 系统管理入口 -->
    <a href="admin/login.html"
       class="card-hover group block p-8 bg-[#1F2421] rounded-3xl shadow-lg">
      <div class="w-16 h-16 mb-6 rounded-2xl bg-white/10 flex items-center justify-center">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </div>
      <h3 class="heading text-2xl text-white mb-2">
        系统管理
      </h3>
      <p class="text-white/70 text-sm font-light leading-relaxed">
        用户管理 · 角色权限 · 系统配置
      </p>
      <div class="mt-6 flex items-center text-white text-sm font-medium">
        <span>进入管理</span>
        <svg class="w-4 h-4 ml-1 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </div>
    </a>

  </div>

  <!-- 底部信息 -->
  <div class="mt-12 text-center">
    <div class="inline-flex items-center gap-6 text-[#5C635D] text-sm">
      <div class="flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
        </svg>
        <span>0471-3353365</span>
      </div>
      <div class="flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>9:00-17:30（法定节假日除外）</span>
      </div>
    </div>
    <p class="mt-4 text-[#5C635D] text-xs font-light">
      © 2026 伊知牛 Probeefer. 源自内蒙古大草原的优质牛羊肉
    </p>
  </div>

</div>

<script src="db.js"></script>
</body>
</html>
