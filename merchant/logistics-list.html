<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>物流信息 - 商家后台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #F7F4EF; }
  .heading { font-family: 'Fraunces', serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body>

<div class="max-w-7xl mx-auto px-6 py-6">
  <div class="mb-6 flex items-center gap-3">
    <a href="logistics.html" class="w-10 h-10 rounded-full hover:bg-white flex items-center justify-center border border-[#E7E1D7]">
      <span class="material-symbols-outlined text-[#1F2421]">arrow_back</span>
    </a>
    <div class="flex-1">
      <h2 class="heading text-3xl text-[#1F2421] mb-1">物流信息</h2>
      <p class="text-[#5C635D] text-sm">查看和管理所有物流记录</p>
    </div>
  </div>

  <!-- 筛选 -->
  <div class="bg-white rounded-2xl border border-[#E7E1D7] p-5 mb-6">
    <div class="flex gap-4">
      <select id="statusFilter" onchange="loadLogistics()"
              class="px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]">
        <option value="">全部状态</option>
        <option value="preparing">待发货</option>
        <option value="shipped">已发货</option>
        <option value="in_transit">运输中</option>
        <option value="delivered">已送达</option>
        <option value="signed">已签收</option>
      </select>
      <input type="text" id="searchInput" placeholder="搜索物流单号、快递单号、收件人..."
             class="flex-1 px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
             oninput="loadLogistics()"/>
    </div>
  </div>

  <!-- 物流列表 -->
  <div class="space-y-4" id="logisticsList">
    <!-- 动态加载 -->
  </div>
</div>

<!-- 核销确认弹窗 -->
<div id="verifyModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-3xl max-w-md w-full p-8">
    <h3 class="heading text-2xl text-[#1F2421] mb-4">确认核销</h3>
    <p class="text-[#5C635D] mb-6">确认用户已收到货物？核销后礼卡将变为已使用状态，不可撤销。</p>
    <div class="flex gap-3">
      <button onclick="closeVerifyModal()"
              class="flex-1 px-4 py-3 border border-[#E7E1D7] text-[#1F2421] rounded-full hover:bg-[#FBF9F5]">
        取消
      </button>
      <button onclick="confirmVerify()"
              class="flex-1 px-4 py-3 bg-green-600 hover:bg-green-700 text-white rounded-full">
        确认核销
      </button>
    </div>
  </div>
</div>

<script src="../db.js"></script>
<script>
const user = DB.getCurrentUser();
if (!user || user.role !== 'merchant') {
  window.location.href = 'login.html';
}

let currentVerifyId = null;

function loadLogistics() {
  const statusFilter = document.getElementById('statusFilter').value;
  const search = document.getElementById('searchInput').value.toLowerCase();

  let logistics = DB._get('logistics');

  // 过滤
  if (statusFilter) logistics = logistics.filter(l => l.status === statusFilter);
  if (search) {
    logistics = logistics.filter(l =>
      l.logistics_no?.toLowerCase().includes(search) ||
      l.order_no?.toLowerCase().includes(search) ||
      l.receiver_name?.toLowerCase().includes(search) ||
      l.receiver_phone?.includes(search)
    );
  }

  logistics.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  const container = document.getElementById('logisticsList');

  if (logistics.length === 0) {
    container.innerHTML = '<div class="bg-white rounded-2xl border border-[#E7E1D7] p-8 text-center text-[#5C635D]">暂无物流信息</div>';
    return;
  }

  container.innerHTML = logistics.map(log => {
    const orders = DB.getOrders();
    const relatedOrders = log.order_ids
      ? log.order_ids.map(id => orders.find(o => o.id === id)).filter(Boolean)
      : [orders.find(o => o.id === log.order_id)].filter(Boolean);

    const statusConfig = {
      preparing: { label: '待发货', color: 'orange', icon: 'schedule' },
      shipped: { label: '已发货', color: 'blue', icon: 'local_shipping' },
      in_transit: { label: '运输中', color: 'indigo', icon: 'departure_board' },
      delivered: { label: '已送达', color: 'purple', icon: 'home' },
      signed: { label: '已签收', color: 'green', icon: 'check_circle' }
    }[log.status];

    return `
      <div class="bg-white rounded-2xl border border-[#E7E1D7] p-6">
        <div class="flex items-start justify-between mb-4">
          <div class="flex-1">
            <div class="flex items-center gap-3 mb-2">
              <span class="material-symbols-outlined text-${statusConfig.color}-600">${statusConfig.icon}</span>
              <h3 class="font-semibold text-[#1F2421]">${log.logistics_company || log.provider}</h3>
              <span class="px-3 py-1 bg-${statusConfig.color}-100 text-${statusConfig.color}-700 rounded-full text-xs font-medium">
                ${statusConfig.label}
              </span>
            </div>
            <div class="space-y-1 text-sm text-[#5C635D]">
              <p>物流订单号: <span class="font-mono font-semibold text-[#1F2421]">${log.order_no}</span></p>
              <p>快递单号: <span class="font-mono">${log.logistics_no}</span></p>
              ${log.courier_name ? `<p>配送员: ${log.courier_name} ${log.courier_phone || ''}</p>` : ''}
            </div>
          </div>

          <div class="flex gap-2">
            ${log.status === 'delivered' ? `
              <button onclick="verifyLogistics(${log.id})"
                      class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-xl text-sm font-medium">
                确认核销
              </button>
            ` : log.status !== 'signed' ? `
              <button onclick="updateLogisticsStatus(${log.id})"
                      class="px-4 py-2 border border-[#E7E1D7] text-[#1F2421] rounded-xl hover:bg-[#FBF9F5] text-sm">
                更新状态
              </button>
            ` : ''}
          </div>
        </div>

        <!-- 订单信息 -->
        ${relatedOrders.length > 0 ? `
          <div class="mb-4 p-4 bg-[#FBF9F5] rounded-xl">
            <p class="text-xs text-[#5C635D] mb-2">包含订单 (${relatedOrders.length})</p>
            <div class="space-y-2">
              ${relatedOrders.map(order => {
                const giftBox = DB.getGiftBox(order.gift_box_id);
                return `
                  <div class="flex items-center justify-between text-sm">
                    <span class="font-mono text-[#5C635D]">${order.order_no}</span>
                    <span class="text-[#1F2421]">${giftBox ? giftBox.name : '-'}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        ` : ''}

        <!-- 收货信息 -->
        <div class="grid grid-cols-2 gap-4 p-4 bg-[#FBF9F5] rounded-xl mb-4">
          <div>
            <p class="text-xs text-[#5C635D] mb-1">收件人</p>
            <p class="text-sm font-medium text-[#1F2421]">${log.receiver_name}</p>
            <p class="text-xs text-[#5C635D]">${log.receiver_phone}</p>
          </div>
          <div>
            <p class="text-xs text-[#5C635D] mb-1">收货地址</p>
            <p class="text-sm text-[#1F2421]">${log.receiver_address}</p>
          </div>
        </div>

        <!-- 时间信息 -->
        <div class="flex items-center gap-6 text-xs text-[#5C635D] mb-3">
          <span>创建: ${new Date(log.created_at).toLocaleString()}</span>
          ${log.shipped_at ? `<span>发货: ${new Date(log.shipped_at).toLocaleString()}</span>` : ''}
          ${log.delivered_at ? `<span>送达: ${new Date(log.delivered_at).toLocaleString()}</span>` : ''}
        </div>

        ${log.note ? `
          <div class="p-3 bg-blue-50 border border-blue-200 rounded-xl mb-3">
            <p class="text-xs text-blue-800"><strong>备注:</strong> ${log.note}</p>
          </div>
        ` : ''}

        ${log.status === 'signed' && log.signed_at ? `
          <div class="p-3 bg-green-50 border border-green-200 rounded-xl">
            <p class="text-xs text-green-800">
              <strong>已核销:</strong> ${new Date(log.signed_at).toLocaleString()}
            </p>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function updateLogisticsStatus(id) {
  const logistics = DB._get('logistics');
  const log = logistics.find(l => l.id === id);
  if (!log) return;

  const nextStatus = {
    preparing: 'shipped',
    shipped: 'in_transit',
    in_transit: 'delivered'
  }[log.status];

  if (nextStatus) {
    DB.updateLogisticsStatus(id, nextStatus);
    loadLogistics();
  }
}

function verifyLogistics(id) {
  currentVerifyId = id;
  document.getElementById('verifyModal').classList.remove('hidden');
}

function closeVerifyModal() {
  currentVerifyId = null;
  document.getElementById('verifyModal').classList.add('hidden');
}

function confirmVerify() {
  if (currentVerifyId) {
    DB.updateLogisticsStatus(currentVerifyId, 'signed');

    // 更新相关订单状态为completed
    const logistics = DB._get('logistics');
    const log = logistics.find(l => l.id === currentVerifyId);
    if (log && log.order_ids) {
      log.order_ids.forEach(orderId => {
        DB.updateOrderStatus(orderId, 'completed');
      });
    } else if (log && log.order_id) {
      DB.updateOrderStatus(log.order_id, 'completed');
    }

    alert('核销成功，礼卡已标记为已使用');
    closeVerifyModal();
    loadLogistics();
  }
}

loadLogistics();
</script>
</body>
</html>
