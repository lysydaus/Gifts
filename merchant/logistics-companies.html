<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>物流公司管理 - 商家后台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #F7F4EF; }
  .heading { font-family: 'Fraunces', serif; }
</style>
</head>
<body>

<div class="max-w-7xl mx-auto px-6 py-6">
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h2 class="heading text-3xl text-[#1F2421] mb-1">物流公司管理</h2>
      <p class="text-[#5C635D] text-sm">管理可选的物流配送公司</p>
    </div>
    <button onclick="openAddModal()"
            class="px-6 py-2.5 bg-[#C4612F] hover:bg-[#A94E22] text-white rounded-full transition-colors">
      + 添加物流公司
    </button>
  </div>

  <!-- 搜索 -->
  <div class="bg-white rounded-2xl border border-[#E7E1D7] p-5 mb-6">
    <div class="flex gap-4">
      <input type="text" id="searchInput" placeholder="搜索公司名称、联系方式、地址..."
             class="flex-1 px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
             oninput="loadCompanies()"/>
    </div>
  </div>

  <!-- 物流公司列表 -->
  <div class="bg-white rounded-2xl border border-[#E7E1D7] overflow-hidden">
    <table class="w-full">
      <thead class="bg-[#FBF9F5] border-b border-[#E7E1D7]">
        <tr>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">ID</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">公司名称</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">联系方式</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">发货地址</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">状态</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">创建时间</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">操作</th>
        </tr>
      </thead>
      <tbody id="companiesTable">
        <tr>
          <td colspan="7" class="px-4 py-8 text-center text-[#5C635D]">加载中...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 添加/编辑弹窗 -->
<div id="editModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-3xl max-w-md w-full p-8">
    <div class="flex items-center justify-between mb-6">
      <h3 class="heading text-2xl text-[#1F2421]" id="modalTitle">添加物流公司</h3>
      <button onclick="closeEditModal()" class="text-[#5C635D] hover:text-[#1F2421]">✕</button>
    </div>

    <form onsubmit="saveCompany(event)" class="space-y-4">
      <input type="hidden" id="editId"/>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">公司名称 *</label>
        <input type="text" id="editName" required
               class="w-full px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
               placeholder="例如：顺丰速运"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">联系方式</label>
        <input type="text" id="editContact"
               class="w-full px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
               placeholder="客服电话或联系方式"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">发货地址</label>
        <input type="text" id="editAddress"
               class="w-full px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
               placeholder="例如：全国各地"/>
      </div>

      <div class="flex gap-3 pt-4">
        <button type="button" onclick="closeEditModal()"
                class="flex-1 px-6 py-2.5 border border-[#E7E1D7] text-[#1F2421] rounded-full hover:bg-[#FBF9F5] transition-colors">
          取消
        </button>
        <button type="submit"
                class="flex-1 px-6 py-2.5 bg-[#C4612F] hover:bg-[#A94E22] text-white rounded-full transition-colors">
          保存
        </button>
      </div>
    </form>
  </div>
</div>

<script src="../db.js"></script>
<script>
// 检查登录状态
const user = DB.getCurrentUser();
if (!user || user.role !== 'merchant') {
  window.location.href = 'login.html';
}

function loadCompanies() {
  const search = document.getElementById('searchInput').value;
  const companies = DB.getLogisticsCompanies({ search });

  const tbody = document.getElementById('companiesTable');

  if (companies.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-[#5C635D]">暂无物流公司</td></tr>';
    return;
  }

  tbody.innerHTML = companies.map(company => `
    <tr class="border-b border-[#E7E1D7] hover:bg-[#FBF9F5] transition-colors">
      <td class="px-4 py-3 text-sm text-[#1F2421]">${company.id}</td>
      <td class="px-4 py-3 text-sm font-medium text-[#1F2421]">${company.name}</td>
      <td class="px-4 py-3 text-sm text-[#5C635D]">${company.contact || '-'}</td>
      <td class="px-4 py-3 text-sm text-[#5C635D]">${company.address || '-'}</td>
      <td class="px-4 py-3">
        <span class="px-2 py-1 bg-${company.status === 'active' ? 'green' : 'gray'}-100
                     text-${company.status === 'active' ? 'green' : 'gray'}-700
                     rounded-full text-xs font-medium">
          ${company.status === 'active' ? '启用' : '禁用'}
        </span>
      </td>
      <td class="px-4 py-3 text-sm text-[#5C635D]">
        ${new Date(company.created_at).toLocaleDateString()}
      </td>
      <td class="px-4 py-3">
        <button onclick="editCompany(${company.id})"
                class="text-[#C4612F] hover:text-[#A94E22] text-sm font-medium mr-3">
          编辑
        </button>
        <button onclick="deleteCompany(${company.id})"
                class="text-red-600 hover:text-red-700 text-sm font-medium">
          删除
        </button>
      </td>
    </tr>
  `).join('');
}

function openAddModal() {
  document.getElementById('modalTitle').textContent = '添加物流公司';
  document.getElementById('editId').value = '';
  document.getElementById('editName').value = '';
  document.getElementById('editContact').value = '';
  document.getElementById('editAddress').value = '';
  document.getElementById('editModal').classList.remove('hidden');
}

function editCompany(id) {
  const company = DB.getLogisticsCompany(id);
  if (!company) return;

  document.getElementById('modalTitle').textContent = '编辑物流公司';
  document.getElementById('editId').value = company.id;
  document.getElementById('editName').value = company.name;
  document.getElementById('editContact').value = company.contact || '';
  document.getElementById('editAddress').value = company.address || '';
  document.getElementById('editModal').classList.remove('hidden');
}

function closeEditModal() {
  document.getElementById('editModal').classList.add('hidden');
}

function saveCompany(event) {
  event.preventDefault();

  const id = document.getElementById('editId').value;
  const data = {
    name: document.getElementById('editName').value,
    contact: document.getElementById('editContact').value,
    address: document.getElementById('editAddress').value
  };

  if (id) {
    DB.updateLogisticsCompany(parseInt(id), data);
  } else {
    DB.createLogisticsCompany(data);
  }

  closeEditModal();
  loadCompanies();
}

function deleteCompany(id) {
  if (!confirm('确认删除此物流公司吗？')) return;

  DB.deleteLogisticsCompany(id);
  loadCompanies();
}

loadCompanies();
</script>
</body>
</html>
