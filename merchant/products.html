<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>产品管理 - 商家后台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #F7F4EF; }
  .heading { font-family: 'Fraunces', serif; }
</style>
</head>
<body>

<div class="max-w-7xl mx-auto px-6 py-6">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="heading text-3xl text-[#1F2421] mb-1">产品管理</h2>
      <p class="text-[#5C635D] text-sm">按供应商管理原料产品，一个供应商可提供多个产品</p>
    </div>
    <button onclick="openAddModal()"
            class="px-6 py-2.5 bg-[#C4612F] hover:bg-[#A94E22] text-white rounded-full transition-colors">
      + 添加产品
    </button>
  </div>

  <!-- 按供应商分组的产品列表 -->
  <div id="productsList">
    <!-- 加载中 -->
  </div>
</div>

<!-- 添加/编辑弹窗 -->
<div id="editModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-3xl max-w-lg w-full p-8 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-6">
      <h3 class="heading text-2xl text-[#1F2421]" id="modalTitle">添加产品</h3>
      <button onclick="closeEditModal()" class="text-[#5C635D] hover:text-[#1F2421]">✕</button>
    </div>

    <form onsubmit="saveProduct(event)" class="space-y-4">
      <input type="hidden" id="editId"/>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">产品名称 *</label>
        <input type="text" id="editName" required
               class="w-full px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
               placeholder="例如：安格斯牛肉"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">所属供应商 *</label>
        <select id="editSupplier" required
                class="w-full px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]">
          <option value="">请选择供应商</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">产品分类 *</label>
        <select id="editCategory" required
                class="w-full px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]">
          <option value="">请选择分类</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">产品描述</label>
        <textarea id="editDescription" rows="2"
                  class="w-full px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
                  placeholder="产品简介"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">产品特点</label>
        <input type="text" id="editFeatures"
               class="w-full px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
               placeholder="多个特点用逗号分隔，例如：进口品质,冷链配送"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">状态</label>
        <select id="editStatus"
                class="w-full px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]">
          <option value="active">启用</option>
          <option value="inactive">停用</option>
        </select>
      </div>

      <div class="flex gap-3 pt-4">
        <button type="button" onclick="closeEditModal()"
                class="flex-1 px-6 py-2.5 border border-[#E7E1D7] text-[#1F2421] rounded-full hover:bg-[#FBF9F5] transition-colors">
          取消
        </button>
        <button type="submit"
                class="flex-1 px-6 py-2.5 bg-[#C4612F] hover:bg-[#A94E22] text-white rounded-full transition-colors">
          保存
        </button>
      </div>
    </form>
  </div>
</div>

<script src="../db.js"></script>
<script>
// 检查登录状态
const user = DB.getCurrentUser();
if (!user || user.role !== 'merchant') {
  window.location.href = 'login.html';
}

function loadProducts() {
  const products = DB._get('products');
  const categories = DB._get('product_categories');
  const suppliers = DB._get('suppliers');
  const container = document.getElementById('productsList');

  if (suppliers.length === 0) {
    container.innerHTML = '<div class="text-center py-12 text-[#5C635D]">暂无供应商，请先添加供应商</div>';
    return;
  }

  // 按供应商分组显示
  container.innerHTML = suppliers.map(supplier => {
    const supplierProducts = products.filter(p => p.supplier_id === supplier.id);

    return `
      <div class="mb-8">
        <div class="flex items-center gap-3 mb-4">
          <h3 class="text-lg font-semibold text-[#1F2421]">${supplier.name}</h3>
          <span class="px-2 py-1 bg-[#F2E3D6] text-[#C4612F] rounded-full text-xs font-medium">
            ${supplierProducts.length} 个产品
          </span>
          ${supplier.contact_person ? `<span class="text-xs text-[#5C635D]">联系人：${supplier.contact_person} ${supplier.phone || ''}</span>` : ''}
        </div>

        ${supplierProducts.length === 0 ? `
          <div class="bg-white rounded-2xl border border-dashed border-[#E7E1D7] p-6 text-center text-sm text-[#5C635D]">
            该供应商暂无产品
          </div>
        ` : `
          <div class="grid md:grid-cols-2 gap-6">
            ${supplierProducts.map(product => {
              const category = categories.find(c => c.id === product.category_id);
              const boxCount = DB._get('gift_boxes').filter(b => b.product_id === product.id).length;

              return `
                <div class="bg-white rounded-2xl border border-[#E7E1D7] overflow-hidden hover:shadow-lg transition-shadow">
                  <div class="aspect-[16/9] bg-[#FBF9F5] relative">
                    ${product.intro_images && product.intro_images[0] ? `
                      <img src="../${product.intro_images[0]}" alt="${product.name}" class="w-full h-full object-cover"/>
                    ` : `
                      <div class="w-full h-full flex items-center justify-center">
                        <span class="text-6xl">${category?.icon || '📦'}</span>
                      </div>
                    `}
                    <div class="absolute top-3 right-3">
                      <span class="px-3 py-1 bg-white/90 backdrop-blur rounded-full text-xs font-medium text-${product.status === 'active' ? '[#C4612F]' : 'gray-500'}">
                        ${product.status === 'active' ? '启用中' : '已停用'}
                      </span>
                    </div>
                  </div>

                  <div class="p-6">
                    <div class="flex items-start justify-between mb-3">
                      <div>
                        <h4 class="text-xl font-semibold text-[#1F2421] mb-1">${product.name}</h4>
                        ${category ? `<span class="px-2 py-1 bg-${category.id === 1 ? 'orange' : 'green'}-100
                             text-${category.id === 1 ? 'orange' : 'green'}-700 rounded-full text-xs font-medium">
                          ${category.name}
                        </span>` : ''}
                        <span class="ml-1 px-2 py-1 bg-[#FBF9F5] border border-[#E7E1D7] text-[#5C635D] rounded-full text-xs">
                          ${boxCount} 个礼盒
                        </span>
                      </div>
                    </div>

                    <p class="text-sm text-[#5C635D] mb-4">${product.description || ''}</p>

                    ${product.features && product.features.length ? `
                      <div class="mb-4">
                        <div class="flex flex-wrap gap-2">
                          ${product.features.map(feature => `
                            <span class="px-2 py-1 bg-[#FBF9F5] border border-[#E7E1D7] text-[#1F2421] rounded-lg text-xs">
                              ${feature}
                            </span>
                          `).join('')}
                        </div>
                      </div>
                    ` : ''}

                    <div class="pt-4 border-t border-[#E7E1D7] flex gap-3">
                      <button onclick="editProduct(${product.id})"
                              class="text-[#C4612F] hover:text-[#A94E22] text-sm font-medium">
                        编辑
                      </button>
                      <button onclick="deleteProduct(${product.id})"
                              class="text-red-600 hover:text-red-700 text-sm font-medium">
                        删除
                      </button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      </div>
    `;
  }).join('');
}

function populateSelects() {
  const suppliers = DB._get('suppliers');
  const categories = DB._get('product_categories');

  document.getElementById('editSupplier').innerHTML =
    '<option value="">请选择供应商</option>' +
    suppliers.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

  document.getElementById('editCategory').innerHTML =
    '<option value="">请选择分类</option>' +
    categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

function openAddModal() {
  populateSelects();
  document.getElementById('modalTitle').textContent = '添加产品';
  document.getElementById('editId').value = '';
  document.getElementById('editName').value = '';
  document.getElementById('editSupplier').value = '';
  document.getElementById('editCategory').value = '';
  document.getElementById('editDescription').value = '';
  document.getElementById('editFeatures').value = '';
  document.getElementById('editStatus').value = 'active';
  document.getElementById('editModal').classList.remove('hidden');
}

function editProduct(id) {
  const product = DB.getProduct(id);
  if (!product) return;

  populateSelects();
  document.getElementById('modalTitle').textContent = '编辑产品';
  document.getElementById('editId').value = product.id;
  document.getElementById('editName').value = product.name;
  document.getElementById('editSupplier').value = product.supplier_id || '';
  document.getElementById('editCategory').value = product.category_id || '';
  document.getElementById('editDescription').value = product.description || '';
  document.getElementById('editFeatures').value = (product.features || []).join(',');
  document.getElementById('editStatus').value = product.status || 'active';
  document.getElementById('editModal').classList.remove('hidden');
}

function closeEditModal() {
  document.getElementById('editModal').classList.add('hidden');
}

function saveProduct(event) {
  event.preventDefault();

  const id = document.getElementById('editId').value;
  const featuresRaw = document.getElementById('editFeatures').value.trim();

  const data = {
    name: document.getElementById('editName').value.trim(),
    supplier_id: parseInt(document.getElementById('editSupplier').value),
    category_id: parseInt(document.getElementById('editCategory').value),
    description: document.getElementById('editDescription').value.trim(),
    features: featuresRaw ? featuresRaw.split(/[,，]/).map(f => f.trim()).filter(Boolean) : [],
    status: document.getElementById('editStatus').value
  };

  if (id) {
    DB.updateProduct(parseInt(id), data);
  } else {
    DB.createProduct(data);
  }

  closeEditModal();
  loadProducts();
}

function deleteProduct(id) {
  const boxCount = DB._get('gift_boxes').filter(b => b.product_id === id).length;
  if (boxCount > 0) {
    alert(`该产品下还有 ${boxCount} 个礼盒，请先移除礼盒后再删除产品`);
    return;
  }
  if (!confirm('确认删除此产品吗？')) return;

  DB.deleteProduct(id);
  loadProducts();
}

loadProducts();
</script>
</body>
</html>
