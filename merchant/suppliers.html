<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>供应商管理 - 商家后台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #F7F4EF; }
  .heading { font-family: 'Fraunces', serif; }
</style>
</head>
<body>

<div class="max-w-7xl mx-auto px-6 py-6">
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h2 class="heading text-3xl text-[#1F2421] mb-1">供应商管理</h2>
      <p class="text-[#5C635D] text-sm">管理产品供应商信息</p>
    </div>
    <button onclick="openAddModal()"
            class="px-6 py-2.5 bg-[#C4612F] hover:bg-[#A94E22] text-white rounded-full transition-colors">
      + 添加供应商
    </button>
  </div>

  <!-- 筛选和搜索 -->
  <div class="bg-white rounded-2xl border border-[#E7E1D7] p-5 mb-6">
    <div class="flex gap-4">
      <select id="categoryFilter" onchange="loadSuppliers()"
              class="px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]">
        <option value="">全部分类</option>
        <option value="1">安格斯牛肉</option>
        <option value="2">苏尼特右旗羊肉</option>
      </select>
      <input type="text" id="searchInput" placeholder="搜索供应商名称、联系人、电话、邮箱..."
             class="flex-1 px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
             oninput="loadSuppliers()"/>
    </div>
  </div>

  <!-- 供应商列表 -->
  <div class="bg-white rounded-2xl border border-[#E7E1D7] overflow-hidden">
    <table class="w-full">
      <thead class="bg-[#FBF9F5] border-b border-[#E7E1D7]">
        <tr>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">ID</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">供应商名称</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">供应产品</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">联系人</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">电话</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">邮箱</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">地址</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">状态</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">操作</th>
        </tr>
      </thead>
      <tbody id="suppliersTable">
        <tr>
          <td colspan="9" class="px-4 py-8 text-center text-[#5C635D]">加载中...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 添加/编辑弹窗 -->
<div id="editModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-3xl max-w-lg w-full p-8">
    <div class="flex items-center justify-between mb-6">
      <h3 class="heading text-2xl text-[#1F2421]" id="modalTitle">添加供应商</h3>
      <button onclick="closeEditModal()" class="text-[#5C635D] hover:text-[#1F2421]">✕</button>
    </div>

    <form onsubmit="saveSupplier(event)" class="space-y-4">
      <input type="hidden" id="editId"/>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">供应商名称 *</label>
        <input type="text" id="editName" required
               class="w-full px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
               placeholder="例如：内蒙古优质牛肉供应商"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">产品分类</label>
        <select id="editCategory"
                class="w-full px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]">
          <option value="">请选择</option>
          <option value="1">安格斯牛肉</option>
          <option value="2">苏尼特右旗羊肉</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">联系人</label>
        <input type="text" id="editContactPerson"
               class="w-full px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
               placeholder="联系人姓名"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">电话</label>
        <input type="tel" id="editPhone"
               class="w-full px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
               placeholder="联系电话"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">邮箱</label>
        <input type="email" id="editEmail"
               class="w-full px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
               placeholder="电子邮箱"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#1F2421] mb-2">地址</label>
        <input type="text" id="editAddress"
               class="w-full px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
               placeholder="供应商地址"/>
      </div>

      <div class="flex gap-3 pt-4">
        <button type="button" onclick="closeEditModal()"
                class="flex-1 px-6 py-2.5 border border-[#E7E1D7] text-[#1F2421] rounded-full hover:bg-[#FBF9F5] transition-colors">
          取消
        </button>
        <button type="submit"
                class="flex-1 px-6 py-2.5 bg-[#C4612F] hover:bg-[#A94E22] text-white rounded-full transition-colors">
          保存
        </button>
      </div>
    </form>
  </div>
</div>

<script src="../db.js"></script>
<script>
// 检查登录状态
const user = DB.getCurrentUser();
if (!user || user.role !== 'merchant') {
  window.location.href = 'login.html';
}

const categoryMap = {
  1: '安格斯牛肉',
  2: '苏尼特右旗羊肉'
};

function loadSuppliers() {
  const search = document.getElementById('searchInput').value;
  const categoryId = document.getElementById('categoryFilter').value;

  const filters = { search };
  if (categoryId) {
    filters.category_id = parseInt(categoryId);
  }

  const suppliers = DB.getSuppliers(filters);
  const tbody = document.getElementById('suppliersTable');

  if (suppliers.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-8 text-center text-[#5C635D]">暂无供应商</td></tr>';
    return;
  }

  tbody.innerHTML = suppliers.map(supplier => `
    <tr class="border-b border-[#E7E1D7] hover:bg-[#FBF9F5] transition-colors">
      <td class="px-4 py-3 text-sm text-[#1F2421]">${supplier.id}</td>
      <td class="px-4 py-3 text-sm font-medium text-[#1F2421]">${supplier.name}</td>
      <td class="px-4 py-3">
        ${(() => {
          const prods = DB.getProducts({ supplier_id: supplier.id });
          if (prods.length === 0) return '<span class="text-xs text-[#5C635D]">暂无产品</span>';
          return prods.map(p => `<span class="inline-block mr-1 mb-1 px-2 py-1 bg-[#FBF9F5] border border-[#E7E1D7] text-[#1F2421] rounded-lg text-xs">${p.name}</span>`).join('');
        })()}
      </td>
      <td class="px-4 py-3 text-sm text-[#5C635D]">${supplier.contact_person || '-'}</td>
      <td class="px-4 py-3 text-sm text-[#5C635D]">${supplier.phone || '-'}</td>
      <td class="px-4 py-3 text-sm text-[#5C635D]">${supplier.email || '-'}</td>
      <td class="px-4 py-3 text-sm text-[#5C635D]">${supplier.address || '-'}</td>
      <td class="px-4 py-3">
        <span class="px-2 py-1 bg-${supplier.status === 'active' ? 'green' : 'gray'}-100
                     text-${supplier.status === 'active' ? 'green' : 'gray'}-700
                     rounded-full text-xs font-medium">
          ${supplier.status === 'active' ? '启用' : '禁用'}
        </span>
      </td>
      <td class="px-4 py-3">
        <button onclick="editSupplier(${supplier.id})"
                class="text-[#C4612F] hover:text-[#A94E22] text-sm font-medium mr-3">
          编辑
        </button>
        <button onclick="deleteSupplier(${supplier.id})"
                class="text-red-600 hover:text-red-700 text-sm font-medium">
          删除
        </button>
      </td>
    </tr>
  `).join('');
}

function openAddModal() {
  document.getElementById('modalTitle').textContent = '添加供应商';
  document.getElementById('editId').value = '';
  document.getElementById('editName').value = '';
  document.getElementById('editCategory').value = '';
  document.getElementById('editContactPerson').value = '';
  document.getElementById('editPhone').value = '';
  document.getElementById('editEmail').value = '';
  document.getElementById('editAddress').value = '';
  document.getElementById('editModal').classList.remove('hidden');
}

function editSupplier(id) {
  const supplier = DB.getSupplier(id);
  if (!supplier) return;

  document.getElementById('modalTitle').textContent = '编辑供应商';
  document.getElementById('editId').value = supplier.id;
  document.getElementById('editName').value = supplier.name;
  document.getElementById('editCategory').value = supplier.category_id || '';
  document.getElementById('editContactPerson').value = supplier.contact_person || '';
  document.getElementById('editPhone').value = supplier.phone || '';
  document.getElementById('editEmail').value = supplier.email || '';
  document.getElementById('editAddress').value = supplier.address || '';
  document.getElementById('editModal').classList.remove('hidden');
}

function closeEditModal() {
  document.getElementById('editModal').classList.add('hidden');
}

function saveSupplier(event) {
  event.preventDefault();

  const id = document.getElementById('editId').value;
  const categoryValue = document.getElementById('editCategory').value;

  const data = {
    name: document.getElementById('editName').value,
    category_id: categoryValue ? parseInt(categoryValue) : null,
    contact_person: document.getElementById('editContactPerson').value,
    phone: document.getElementById('editPhone').value,
    email: document.getElementById('editEmail').value,
    address: document.getElementById('editAddress').value
  };

  if (id) {
    DB.updateSupplier(parseInt(id), data);
  } else {
    DB.createSupplier(data);
  }

  closeEditModal();
  loadSuppliers();
}

function deleteSupplier(id) {
  if (!confirm('确认删除此供应商吗？')) return;

  DB.deleteSupplier(id);
  loadSuppliers();
}

loadSuppliers();
</script>
</body>
</html>
