<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>礼盒管理 - 商家后台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #F7F4EF; }
  .heading { font-family: 'Fraunces', serif; }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
</style>
</head>
<body>

<div class="max-w-7xl mx-auto px-6 py-6">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="heading text-3xl text-[#1F2421] mb-1">礼盒管理</h2>
      <p class="text-[#5C635D] text-sm">管理礼盒产品及可兑换礼卡规格</p>
    </div>
  </div>

  <!-- 筛选 -->
  <div class="bg-white rounded-2xl border border-[#E7E1D7] p-5 mb-6">
    <div class="flex gap-4">
      <select id="categoryFilter" onchange="loadGiftBoxes()"
              class="px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]">
        <option value="">全部分类</option>
        <option value="1">安格斯牛肉</option>
        <option value="2">苏尼特右旗羊肉</option>
      </select>
      <input type="text" id="searchInput" placeholder="搜索礼盒名称..."
             class="flex-1 px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"
             oninput="loadGiftBoxes()"/>
    </div>
  </div>

  <!-- 礼盒产品列表 -->
  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6" id="giftBoxesList">
    <!-- 加载中 -->
  </div>
</div>

<script src="../db.js"></script>
<script>
// 检查登录状态
const user = DB.getCurrentUser();
if (!user || user.role !== 'merchant') {
  window.location.href = 'login.html';
}

function loadGiftBoxes() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const categoryId = document.getElementById('categoryFilter').value;

  let giftBoxes = DB.getGiftBoxes();
  const cardTypes = DB._get('card_types');
  const products = DB._get('products');
  const categories = DB._get('product_categories');

  // 筛选
  if (categoryId) {
    giftBoxes = giftBoxes.filter(box => box.category_id === parseInt(categoryId));
  }
  if (search) {
    giftBoxes = giftBoxes.filter(box => box.name.toLowerCase().includes(search));
  }

  const container = document.getElementById('giftBoxesList');

  if (giftBoxes.length === 0) {
    container.innerHTML = '<div class="col-span-3 text-center py-12 text-[#5C635D]">暂无礼盒</div>';
    return;
  }

  container.innerHTML = giftBoxes.map(box => {
    const product = products.find(p => p.id === box.product_id);
    const category = categories.find(c => c.id === box.category_id);
    const availableCardTypes = cardTypes.filter(ct => box.card_types.includes(ct.name.replace('型', '')));

    return `
      <div class="bg-white rounded-2xl border border-[#E7E1D7] overflow-hidden hover:shadow-lg transition-shadow">
        <div class="aspect-[4/3] bg-[#FBF9F5] relative">
          ${box.images && box.images[0] ? `
            <img src="../${box.images[0]}" alt="${box.name}" class="w-full h-full object-cover"/>
          ` : `
            <div class="w-full h-full flex items-center justify-center">
              <span class="material-symbols-outlined text-6xl text-[#E7E1D7]">inventory_2</span>
            </div>
          `}
          <div class="absolute top-3 right-3">
            <span class="px-3 py-1 bg-white/90 backdrop-blur rounded-full text-xs font-medium ${
              box.status === 'active' ? 'text-green-700' : 'text-gray-700'
            }">
              ${box.status === 'active' ? '上架中' : '已下架'}
            </span>
          </div>
          <div class="absolute top-3 left-3">
            ${category ? `<span class="px-3 py-1 bg-${category.id === 1 ? 'orange' : 'green'}-100
                 text-${category.id === 1 ? 'orange' : 'green'}-700 rounded-full text-xs font-medium">
              ${category.name}
            </span>` : ''}
          </div>
        </div>

        <div class="p-5">
          <h3 class="text-lg font-semibold text-[#1F2421] mb-2">${box.name}</h3>
          <p class="text-sm text-[#5C635D] mb-3 line-clamp-2">${box.description}</p>

          <div class="flex items-center gap-4 mb-4 pb-4 border-b border-[#E7E1D7]">
            <div>
              <p class="text-xs text-[#5C635D] mb-1">价格</p>
              <p class="text-xl font-bold text-[#C4612F]">¥${box.price}</p>
            </div>
            <div>
              <p class="text-xs text-[#5C635D] mb-1">重量</p>
              <p class="text-sm font-medium text-[#1F2421]">${box.weight}</p>
            </div>
          </div>

          <div class="mb-4">
            <p class="text-xs text-[#5C635D] mb-2">礼盒内容</p>
            <div class="space-y-1">
              ${box.contents.slice(0, 3).map(item => `
                <div class="flex items-center gap-2 text-xs text-[#1F2421]">
                  <span class="w-1 h-1 rounded-full bg-[#C4612F]"></span>
                  <span>${item}</span>
                </div>
              `).join('')}
              ${box.contents.length > 3 ? `
                <div class="text-xs text-[#5C635D] pl-3">
                  +${box.contents.length - 3} 更多...
                </div>
              ` : ''}
            </div>
          </div>

          <div class="mb-4">
            <p class="text-xs text-[#5C635D] mb-2">可兑换礼卡</p>
            <div class="flex flex-wrap gap-2">
              ${availableCardTypes.map(ct => `
                <span class="px-2 py-1 bg-[#F2E3D6] text-[#C4612F] rounded-lg text-xs font-medium">
                  ${ct.name} ¥${ct.amount}
                </span>
              `).join('')}
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

loadGiftBoxes();
</script>
</body>
</html>
