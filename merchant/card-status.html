<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>礼卡状态管理 - 商家后台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #F7F4EF; }
  .heading { font-family: 'Fraunces', serif; }
</style>
</head>
<body>

<div class="max-w-7xl mx-auto px-6 py-6">
  <!-- 页头 -->
  <div class="mb-6">
    <h2 class="heading text-3xl text-[#1F2421] mb-1">礼卡状态管理</h2>
    <p class="text-[#5C635D] text-sm">查询礼卡状态，执行冻结和解冻操作</p>
  </div>

  <!-- 统计卡片 -->
  <div class="grid grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-2xl border border-[#E7E1D7] p-5">
      <p class="text-xs text-[#5C635D] mb-1">总礼卡数</p>
      <p class="text-2xl font-semibold text-[#1F2421]" id="stat_total">0</p>
    </div>
    <div class="bg-white rounded-2xl border border-[#E7E1D7] p-5">
      <p class="text-xs text-[#5C635D] mb-1">激活状态</p>
      <p class="text-2xl font-semibold text-green-600" id="stat_active">0</p>
    </div>
    <div class="bg-white rounded-2xl border border-[#E7E1D7] p-5">
      <p class="text-xs text-[#5C635D] mb-1">已冻结</p>
      <p class="text-2xl font-semibold text-red-600" id="stat_frozen">0</p>
    </div>
    <div class="bg-white rounded-2xl border border-[#E7E1D7] p-5">
      <p class="text-xs text-[#5C635D] mb-1">已过期</p>
      <p class="text-2xl font-semibold text-orange-600" id="stat_expired">0</p>
    </div>
  </div>

  <!-- 筛选和搜索 -->
  <div class="bg-white rounded-2xl border border-[#E7E1D7] p-5 mb-6">
    <div class="flex gap-4">
      <div class="flex-1">
        <input type="text" id="searchInput" placeholder="搜索卡号..."
               class="w-full px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]"/>
      </div>
      <select id="statusFilter"
              class="px-4 py-2 rounded-xl border border-[#E7E1D7] focus:outline-none focus:border-[#C4612F]">
        <option value="">全部状态</option>
        <option value="active">激活</option>
        <option value="frozen">冻结</option>
        <option value="used">已使用</option>
        <option value="expired">已过期</option>
      </select>
      <button onclick="loadCards()"
              class="px-6 py-2 bg-[#1F2421] text-white rounded-xl hover:bg-[#2a2f2b] transition-colors">
        查询
      </button>
    </div>
  </div>

  <!-- 礼卡列表 -->
  <div class="bg-white rounded-2xl border border-[#E7E1D7] overflow-hidden">
    <table class="w-full">
      <thead class="bg-[#FBF9F5] border-b border-[#E7E1D7]">
        <tr>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">ID</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">卡号</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">密码</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">金额</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">类型</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">状态</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">创建时间</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">有效期</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-[#5C635D]">操作</th>
        </tr>
      </thead>
      <tbody id="cardsTable">
        <tr>
          <td colspan="9" class="px-4 py-8 text-center text-[#5C635D]">加载中...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 礼卡详情弹窗 -->
<div id="cardModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-3xl max-w-md w-full p-8">
    <h3 class="heading text-2xl text-[#1F2421] mb-6">礼卡详情</h3>
    <div id="cardDetails" class="space-y-3 text-sm">
      <!-- 动态加载 -->
    </div>
    <div class="mt-6">
      <button onclick="closeCardModal()"
              class="w-full px-4 py-3 border border-[#E7E1D7] text-[#1F2421] rounded-full hover:bg-[#FBF9F5]">
        关闭
      </button>
    </div>
  </div>
</div>

<script src="../db.js"></script>
<script>
// 检查登录状态
const user = DB.getCurrentUser();
if (!user || user.role !== 'merchant') {
  window.location.href = 'login.html';
}

// 加载礼卡列表
function loadCards() {
  const search = document.getElementById('searchInput').value;
  const status = document.getElementById('statusFilter').value;

  let cards = DB._get('gift_cards');

  // 筛选
  if (search) {
    cards = cards.filter(card => {
      const cardNo = DB._decrypt(card.card_no_encrypted);
      return cardNo.includes(search);
    });
  }

  if (status) {
    cards = cards.filter(card => card.status === status);
  }

  // 更新统计
  const allCards = DB._get('gift_cards');
  document.getElementById('stat_total').textContent = allCards.length;
  document.getElementById('stat_active').textContent = allCards.filter(c => c.status === 'active').length;
  document.getElementById('stat_frozen').textContent = allCards.filter(c => c.status === 'frozen').length;
  document.getElementById('stat_expired').textContent = allCards.filter(c => c.status === 'expired').length;

  // 渲染表格
  const tbody = document.getElementById('cardsTable');
  if (cards.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-8 text-center text-[#5C635D]">暂无数据</td></tr>';
    return;
  }

  tbody.innerHTML = cards.map(card => {
    const cardType = DB._get('card_types').find(t => t.id === card.type_id);

    const statusBadge = {
      'active': '<span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs">激活</span>',
      'frozen': '<span class="px-2 py-1 bg-red-100 text-red-700 rounded-full text-xs">冻结</span>',
      'used': '<span class="px-2 py-1 bg-gray-100 text-gray-700 rounded-full text-xs">已使用</span>',
      'expired': '<span class="px-2 py-1 bg-orange-100 text-orange-700 rounded-full text-xs">已过期</span>'
    }[card.status];

    return `
      <tr class="border-b border-[#E7E1D7] hover:bg-[#FBF9F5] transition-colors">
        <td class="px-4 py-3 text-sm text-[#1F2421]">${card.id}</td>
        <td class="px-4 py-3 text-sm font-mono text-[#1F2421]">${DB._decrypt(card.card_no_encrypted)}</td>
        <td class="px-4 py-3 text-sm font-mono text-[#5C635D]">${DB._decrypt(card.password_encrypted)}</td>
        <td class="px-4 py-3 text-sm font-semibold text-[#C4612F]">¥${card.amount}</td>
        <td class="px-4 py-3 text-sm text-[#5C635D]">${cardType ? cardType.name : '-'}</td>
        <td class="px-4 py-3">${statusBadge}</td>
        <td class="px-4 py-3 text-sm text-[#5C635D]">${new Date(card.created_at).toLocaleDateString()}</td>
        <td class="px-4 py-3 text-sm text-[#5C635D]">${new Date(card.expire_at).toLocaleDateString()}</td>
        <td class="px-4 py-3">
          <div class="flex gap-2">
            <button onclick="viewCard(${card.id})" class="text-blue-600 hover:text-blue-700 text-sm">详情</button>
            ${card.status === 'active' ? `
              <button onclick="freezeCard(${card.id})" class="text-red-600 hover:text-red-700 text-sm">冻结</button>
            ` : ''}
            ${card.status === 'frozen' ? `
              <button onclick="unfreezeCard(${card.id})" class="text-green-600 hover:text-green-700 text-sm">解冻</button>
            ` : ''}
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

// 查看礼卡详情
function viewCard(id) {
  const cards = DB._get('gift_cards');
  const card = cards.find(c => c.id === id);
  if (!card) return;

  const cardType = DB._get('card_types').find(t => t.id === card.type_id);

  const details = `
    <div class="space-y-3">
      <div class="flex justify-between py-2 border-b border-[#E7E1D7]">
        <span class="text-[#5C635D]">卡号</span>
        <span class="font-mono text-[#1F2421]">${DB._decrypt(card.card_no_encrypted)}</span>
      </div>
      <div class="flex justify-between py-2 border-b border-[#E7E1D7]">
        <span class="text-[#5C635D]">密码</span>
        <span class="font-mono text-[#1F2421]">${DB._decrypt(card.password_encrypted)}</span>
      </div>
      <div class="flex justify-between py-2 border-b border-[#E7E1D7]">
        <span class="text-[#5C635D]">类型</span>
        <span class="text-[#1F2421]">${cardType ? cardType.name : '-'}</span>
      </div>
      <div class="flex justify-between py-2 border-b border-[#E7E1D7]">
        <span class="text-[#5C635D]">金额</span>
        <span class="font-semibold text-[#C4612F]">¥${card.amount}</span>
      </div>
      <div class="flex justify-between py-2 border-b border-[#E7E1D7]">
        <span class="text-[#5C635D]">状态</span>
        <span class="text-[#1F2421]">${{
          'active': '激活',
          'frozen': '冻结',
          'used': '已使用',
          'expired': '已过期'
        }[card.status]}</span>
      </div>
      <div class="flex justify-between py-2 border-b border-[#E7E1D7]">
        <span class="text-[#5C635D]">创建时间</span>
        <span class="text-[#5C635D]">${new Date(card.created_at).toLocaleString()}</span>
      </div>
      <div class="flex justify-between py-2">
        <span class="text-[#5C635D]">有效期至</span>
        <span class="text-[#5C635D]">${new Date(card.expire_at).toLocaleDateString()}</span>
      </div>
    </div>
  `;

  document.getElementById('cardDetails').innerHTML = details;
  document.getElementById('cardModal').classList.remove('hidden');
}

function closeCardModal() {
  document.getElementById('cardModal').classList.add('hidden');
}

// 冻结礼卡
function freezeCard(id) {
  if (!confirm('确认冻结此礼卡？冻结后客户将无法使用。')) return;

  const cards = DB._get('gift_cards');
  const index = cards.findIndex(c => c.id === id);
  if (index !== -1) {
    cards[index].status = 'frozen';
    DB._set('gift_cards', cards);
    loadCards();
    alert('礼卡已冻结');
  }
}

// 解冻礼卡
function unfreezeCard(id) {
  if (!confirm('确认解冻此礼卡？')) return;

  const cards = DB._get('gift_cards');
  const index = cards.findIndex(c => c.id === id);
  if (index !== -1) {
    cards[index].status = 'active';
    DB._set('gift_cards', cards);
    loadCards();
    alert('礼卡已解冻');
  }
}

loadCards();
</script>
</body>
</html>
